{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Static Area Chart Demo</title>
    <!-- Load Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Patient Visits Over Time (Static Data)</h2>

    <!-- Canvas element where chart will render -->
    <div style="width:400px; height:400px;">
        <canvas id="visitChart" width="400" height="300"></canvas>
    </div> {% endcomment %}

    {% comment %}
    <script>
      const ctx = document.getElementById('visitChart').getContext('2d');

      const visitChart = new Chart(ctx, {
        type: 'line',  // Line chart with area fill looks like area chart
        data: {
          labels: ['2025-01-01', '2025-01-02', '2025-01-03', '2025-01-04', '2025-01-05'],
          datasets: [{
            label: 'Number of Patients',
            data: [5, 10, 7, 12, 8],
            backgroundColor: 'rgba(54, 162, 235, 0.4)',  // Blue with transparency for area
            borderColor: 'rgba(54, 162, 235, 1)',       // Blue border line
            borderWidth: 2,
            fill: true,     // This fills the area under the line
            tension: 0.3    // Smooth curve
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Patients'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Date'
              }
            }
          }
        }
      });
    </script> {% endcomment %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrollable Line Chart (Last 12 Months Default)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4"></script>
  <style>
    .scroll-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #ccc;
      padding-bottom: 10px;
    }

    {% comment %} .canvas-container {
      width: 2400px; /* Force width (e.g., 100px * 24 months) */
      height: 400px;
    } {% endcomment %}

    #myChart {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<h3>Monthly Patients (Scroll Left to See Older)</h3>

<div class="scroll-wrapper" id="scrollWrapper" style="width: 800px; height: 400px;">
  <div class="canvas-container" style="width: 2400px; height: 400px;">
    <canvas id="myChart"></canvas>
  </div>
</div>

<script>
  const labels = [
    'Jan 2023', 'Feb 2023', 'Mar 2023', 'Apr 2023', 'May 2023', 'Jun 2023',
    'Jul 2023', 'Aug 2023', 'Sep 2023', 'Oct 2023', 'Nov 2023', 'Dec 2023',
    'Jan 2024', 'Feb 2024', 'Mar 2024', 'Apr 2024', 'May 2024', 'Jun 2024',
    'Jul 2024', 'Aug 2024', 'Sep 2024', 'Oct 2024', 'Nov 2024', 'Dec 2024'
  ];

  const data = [
    100, 110, 90, 95, 105, 130,
    120, 115, 140, 150, 160, 170,
    180, 175, 190, 200, 210, 220,
    230, 240, 250, 260, 270, 280
  ];

  const ctx = document.getElementById("myChart").getContext("2d");

  const myChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: "Monthly Patients",
        data: data,
        borderColor: "rgba(78, 115, 223, 1)",
        backgroundColor: "rgba(78, 115, 223, 0.05)",
        pointRadius: 3,
        lineTension: 0.3
      }]
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      scales: {
        xAxes: [{
          ticks: {
            autoSkip: false,
            maxRotation: 45,
            minRotation: 45
          }
        }],
        yAxes: [{
          ticks: {
            beginAtZero: true
          }
        }]
      }
    }
  });

  // Auto scroll to the end
  window.addEventListener('load', () => {
    const scrollWrapper = document.getElementById('scrollWrapper');
    scrollWrapper.scrollLeft = scrollWrapper.scrollWidth;
  });
</script>

</body>
</html>
