{% extends 'layout.html' %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center">
        <div class="nav-container" style="display: flex; gap: 10px; justify-content: center;">
            <button class="cnav-btn" onclick="window.history.back()" title="Back"><i class="fa fa-arrow-left"></i></button>
            <button class="cnav-btn" onclick="window.history.forward()" title="Forward"><i class="fa fa-arrow-right"></i></button>
            <h2 class="mb-0 custome-color-dark">Edit Clinic Details</h2>  
        </div>
    </div>
    <hr>

    <div id="clinic-from-div" style="display:none;">
        <div class="justify-content-center">
            <form method="POST" class="clinic_form">
                {% csrf_token %}
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6">
                        <label class="form-label">Clinic Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Clinic Name" style="width: 100%;" maxlength="50"
                            {% if request.user.clinic.name %}value="{{request.user.clinic.name}}"{% endif %} oninput="validateInput(this)" required disabled>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="example@gmail.com" style="width: 100%;" 
                        maxlength="50" {% if request.user.clinic.email %}value="{{request.user.clinic.email}}"{% endif %} oninput="validateInput(this)" required disabled>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6"><label class="form-label">Number</label>
                        <input type="number" class="form-control" name="number" placeholder="XXXXXXXXXX" style="width: 100%;" 
                        min="1000000000" max="9999999999" {% if request.user.clinic.number %}value="{{request.user.clinic.number}}"{% endif %} oninput="validateInput(this)" required disabled>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" name="address" placeholder="Address" style="width: 100%;" 
                        maxlength="150" {% if request.user.clinic.address %}value="{{request.user.clinic.address}}"{% endif %} oninput="validateInput(this)" required disabled>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6">
                        <label class="form-label">State Name</label>
                        <select id="clinic_state" class="form-control" name="state" style="width: 100%;" required disabled>
                            {% if request.user.clinic.state %}
                            <option value="{{request.user.clinic.state.id}}" selected>{{request.user.clinic.state.name}}</options>
                            {% else %}
                            <option value="">Select a state</option>
                            {% endif %}
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">City Name</label>
                        <select id="clinic_city" class="form-control" name="city" style="width: 100%;" required disabled>
                            {% if request.user.clinic.city %}
                            <option value="{{request.user.clinic.city.id}}" selected>{{request.user.clinic.city.name}}</options>
                            {% else %}
                            <option value="">Select a city</option>
                            {% endif %}
                        </select>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6">
                        <label class="form-label">Pincode</label>
                        <input type="number" class="form-control" name="pincode" placeholder="XXXXXX" style="width: 100%;" 
                        min="100000" max="999999" {% if request.user.clinic.pincode %}value="{{request.user.clinic.pincode}}"{% endif %}oninput="validateInput(this)" required disabled>
                    </div>
                    {% comment %} <div class="col"><label class="form-label">Profile Image</label>
                        <input type="file" class="form-control"  name="profile_img" placeholder="Profile Image" style="width: 100%;" accept="image/png, image/jpeg" required onchange="validateFileSize(event)">
                    </div> {% endcomment %}
                </div>
                
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6">
                        <label class="form-label">Specialization</label>
                        <textarea name="specializations" class="form-control" placeholder="" style="width: 100%; resize:none;" 
                            oninput="validateInput(this)" rows="4" required disabled>{% if request.user.clinic.specializations %}{{request.user.clinic.specializations}}{% endif %}</textarea>
                    </div>
                </div>
                <div class="row" style="margin-top: 20px; margin-bottom: 20px; padding-left:10px;">
                    <button class="btn cb" name="submit_clinic_details" type="submit" style="width: 10rem; display:none;">Save</button>
                    <button class="btn cb" name="hide_clinic_details" type="button" style="width: 10rem; display:none;">Hide</button>
                </div>
            </form>
        </div>
    </div>
