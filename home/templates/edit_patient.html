{% extends 'layout.html' %}
            {% block content %}
                <div class="d-flex justify-content-between align-items-center">
                    <div class="nav-container" style="display: flex; gap: 10px; justify-content: center;">
                        <button class="cnav-btn" onclick="window.history.back()" title="Back"><i class="fa fa-arrow-left"></i></button>
                        <button class="cnav-btn" onclick="window.history.forward()" title="Forward"><i class="fa fa-arrow-right"></i></button>
                        <h2 class="mb-0 custome-color-dark">Edit Patient Details</h2>
                    </div>
                </div>
                <hr>
                <div class="justify-content-center">                  
                    <form method="POST" action="{% url 'edit_patient' patient_id=patient.id %}" enctype="multipart/form-data" id="profile_form">
                        {% csrf_token %}
                        <div class="row" style="margin-top: 10px;">
                            <div class="col-sm-6"><label class="form-label">Name</label>
                                <input type="text" class="form-control" name="name" placeholder="Name" style="width: 100%;"
                                     maxlength="50" value="{{patient.name}}" required>
                            </div>
                            <div class="col-sm-6"><label class="form-label">Age</label>
                                <input type="number" class="form-control" name="age" placeholder="Age" style="width: 100%;"
                                    max="150" min="0" step="0.1" value="{{patient.age}}">
                            </div>
                        </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="col-sm-6">
                                <label class="form-label">Gender</label>
                                <select class="form-control" name="gender" style="width: 100%;">
                                  {% if patient.gender %}
                                  <option value="{{ patient.gender }}">{{ patient.gender }}</option>
                                  {% endif %}
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" name="number" placeholder="Contact Number" style="width: 100%;" pattern="[0-9]{10}" {% if patient.number %} value="{{patient.number}}"{% endif %}>
                            </div>
                        </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="col-sm-6">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" name="address" placeholder="Address" style="width: 100%; resize: none;" rows="3" maxlength="200">{% if patient.address %}{{patient.address}}{% endif %}</textarea>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Medical History</label>
                                <textarea class="form-control" name="medical_history" placeholder="Medical History" style="width: 100%; resize: none;" rows="3" >{% if patient.medical_history %}{{patient.medical_history}}{% endif %}</textarea>
                            </div>                                           
                            
                        </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="col-sm-6">
                                <label class="form-label">Blood Group</label>
                                <select class="form-control" style="width: 100%;" name="blood_group">
                                  {% if patient.blood_group %}
                                    <option value="{{patient.blood_group}}">{{ patient.blood_group }}</option>
                                  {% endif %}
                                    <option value="">Select Blood Group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O+">O -</option>
                                </select>
                            </div>
                            <div class="col-sm-3">
                                <label class="form-label">Upload Patient Report Image</label><!-- application/pdf -->
                                <input type="file" class="form-control" name="image" placeholder="Upload Image" style="width: 100%;" accept="image/*">
                            </div>
                          {% if patient.image %}
                            <div style="margin-top:20px; margin-left:10px;">
                                <img src="{{patient.image.url}}" alt="report" style="width:50px; height:50px;">
                            </div>
                          {% endif %}
                        </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="col-sm-6">
                                <label class="form-label">Clinic</label>
                                <select class="form-control" style="width: 100%;" name="clinic" required>
                                  {% for clinic in clinics %}
                                    <option value="{{clinic.id}}">{{clinic.name}}</option>
                                  {% endfor %}
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Doctor</label>
                                <select class="form-control" style="width: 100%;" name="doctor" required>
                                  {% for doctor in doctors %}
                                    {% if doctor.2 == patient.doctor_id %}
                                      <option value="{{doctor.0}}" selected>{{doctor.1}}</option>
                                    {% else %}
                                      <option value="{{doctor.0}}">{{doctor.1}}</option>
                                    {% endif %}
                                  {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div style="padding:20px 20px 20px 0px;">
                            <button class="btn cb" type="submit" style="">Save</button>
                            <a data-url="{% url 'delete_patient' patient.id %}" class="btn cb" title="Delete Record"  data-toggle="modal" data-target="#deleteConfirmModal"  onclick="showDeleteModal(this)">
                                Delete
                            </a>
                        </div>
                    </form>
                    
                    <!--Patient delete confirmation modal -->
                    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <div class="modal-header custome-m-dark">
                                    <h5 class="modal-title">Confirm Deletion</h5>
                                    <button type="button" class="cnav-btn" data-dismiss="modal" aria-label="Close" title="Close"><i class="fa fa-window-close"></i></button>
                                </div>
                                <div class="modal-body">
                                    <p>Are you sure you want to delete this Group? This action cannot be undone.</p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                                    <a id="confirmDeleteBtn" class="btn btn-danger" href="#">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- end Patient modal -->
                </div>
                
                <script>
                    function showDeleteModal(element) {
                        let deleteUrl = element.getAttribute("data-url");
                        console.log(deleteUrl)
                        document.getElementById("confirmDeleteBtn").href = deleteUrl;
                    }
                </script>
            {% endblock %}
