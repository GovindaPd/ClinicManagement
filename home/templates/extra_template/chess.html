<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
        }
        .chess-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 80px);
            grid-template-rows: repeat(8, 80px);
            border: 5px solid #000;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            transform: perspective(800px) rotateX(25deg);
        }
        .square {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
        }
        .dark { background-color: #769656; }
        .light { background-color: #eeeed2; }
    </style>
</head>
<body>
    <h1>3D Chess Game</h1>
    <div class="chess-container">
        <div id="chessboard" class="chessboard"></div>
    </div>

    <script>
        $(document).ready(function () {
            let board = $("#chessboard");
            let pieces = {
                'P': '&#9817;', 'R': '&#9814;', 'N': '&#9816;', 'B': '&#9815;', 'Q': '&#9813;', 'K': '&#9812;',
                'p': '&#9823;', 'r': '&#9820;', 'n': '&#9822;', 'b': '&#9821;', 'q': '&#9819;', 'k': '&#9818;'
            };
            let initialSetup = [
                "rnbqkbnr", "pppppppp", "........", "........",
                "........", "........", "PPPPPPPP", "RNBQKBNR"
            ];
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    let color = (row + col) % 2 === 0 ? "light" : "dark";
                    let square = $(`<div class='square ${color}' data-row='${row}' data-col='${col}'>`);
                    let piece = initialSetup[row][col];
                    if (piece !== '.') square.html(pieces[piece]);
                    board.append(square);
                }
            }
        });
    </script>
</body>
</html>
