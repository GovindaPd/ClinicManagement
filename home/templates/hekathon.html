<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        canvas {
            border: 2px solid #000;
            width: 100%;
            height: 150px;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Hackathon Registration Form</h2>
        <form id="registrationForm">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" name="fullName" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number *</label>
                <input type="tel" class="form-control" name="phoneNumber" pattern="[0-9]{10}" required>
                <small class="form-text text-muted">Enter 10-digit phone number without spaces or dashes</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" placeholder="Street Address">
                <input type="text" class="form-control mt-2" name="addressLine2" placeholder="Street Address Line 2">
                <div class="row mt-2">
                    <div class="col">
                        <input type="text" class="form-control" name="city" placeholder="City">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" name="state" placeholder="State/Province">
                    </div>
                </div>
                <input type="text" class="form-control mt-2" name="postalCode" placeholder="Postal/Zip Code">
            </div>
            <div class="mb-3">
                <label class="form-label">Institution/Company</label>
                <input type="text" class="form-control" name="institution">
            </div>
            <div class="mb-3">
                <label class="form-label">Role/Position</label>
                <input type="text" class="form-control" name="role">
            </div>
            <div class="mb-3">
                <label class="form-label">Skills/Expertise</label>
                <input type="text" class="form-control" name="skills">
            </div>
            <div class="mb-3">
                <label class="form-label">Team Name</label>
                <input type="text" class="form-control" name="teamName">
            </div>
            <div class="mb-3">
                <label class="form-label">Number of Team Members</label>
                <input type="number" class="form-control" name="teamMembers" placeholder="e.g., 3" min="1">
            </div>
            <div class="mb-3">
                <label class="form-label">Have you participated in a hackathon before?</label>
                <div>
                    <input type="radio" name="hackathon" value="yes" required> Yes
                    <input type="radio" name="hackathon" value="no" class="ms-3" required> No
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Briefly describe any project ideas or areas of interest</label>
                <textarea class="form-control" name="projectIdeas"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Additional Comments</label>
                <textarea class="form-control" name="comments"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Signature</label>
                <canvas class="jSignature" id="signature-pad" width="310" style="margin: 0px; padding: 0px; border: 1 px solid black; height: 114px; width: 310px; touch-action: none; background-color: rgb(255, 255, 255);"
                 height="114"></canvas>
                <button type="button" id="clear-signature" class="btn btn-danger btn-sm mt-2">Clear</button>
                <input type="hidden" name="signature" id="signature-input">
            </div>
            <div class="mb-3">
                <label class="form-label">Date Signed</label>
                <input type="date" class="form-control" name="dateSigned" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success">Register</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById('registrationForm');
            const canvas = document.getElementById("signature-pad");
            const clearButton = document.getElementById("clear-signature");
            const signatureInput = document.getElementById("signature-input");

            const signaturePad = new SignaturePad(canvas, {
                backgroundColor: 'rgba(255, 255, 255, 0)',
                penColor: "black"
            });

            clearButton.addEventListener("click", () => {
                signaturePad.clear();
                signatureInput.value = "";
            });

            form.addEventListener('submit', function (event) {
                // Check if signature is drawn
                if (signaturePad.isEmpty()) {
                    alert("Please provide your signature.");
                    event.preventDefault(); // Prevent form submission
                    return;
                }

                // Save signature image data
                signatureInput.value = signaturePad.toDataURL();
            });
        });
    </script>
</body>
</html>
