{% extends 'layout.html' %}
    {% block content %}
        <div class="d-flex justify-content-between align-items-center">
            <div class="nav-container" style="display: flex; gap: 20px; justify-content: center;">
                <button class="cnav-btn" onclick="window.history.back()" title="Back"><i class="fa fa-arrow-left"></i></button>
                <button class="cnav-btn" onclick="window.history.forward()" title="Forward"><i class="fa fa-arrow-right"></i></button>
                <h2 class="mb-0 custome-color-dark">Edit Group</h2>
            </div>
        </div>
        <hr>
        <div class="justify-content-center">
            <form method="POST" id="group-form">
                {% csrf_token %}
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-6"><label class="form-label">Name* <small id="username_error" style="color:red; display:none;">name is not available</small></label>
                        <input type="text" class="form-control" name="name" placeholder="Name must be unique" style="width: 100%;"
                            maxlength="100" value="{{group.name}}" oninput="checkUnique(this)" required>
                    </div>
                </div>

                <div style="margin-top:20px;"><span >Permissions</span></div>
                <hr>
                <div class="row" style="margin-top: 10px;">
                    <div class="col-sm-5">
                        <label class="form-label">Available Permissions</label>
                        <div class="d-flex justify-content-center">
                            <select class="form-control bg-light text-dark" id="old_permissions" name="old_permissions" multiple style="max-width:400px; height:400px;">
                                {% for per in permissions %}
                                    <option value="{{per.id}}">{{per.name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-2 d-flex flex-column justify-content-center align-items-center" style="margin-top: 10px;">
                        <button class="btn bg-secondary text-light" id="move-to-choosen" type="button" style="border-radius:50%;" onclick="moveToChoosen()">
                            <span class=""><i class="fa fa-arrow-right"></i></span>
                        </button>
                        <button class="btn bg-secondary text-light" id="move-to-available" type="button" style="border-radius:50%;" onclick="moveToPermission()">
                            <span class=""><i class="fa fa-arrow-left"></i></span>
                        </button>
                    </div>
                    <div class="col-sm-5">
                        <label class="form-label">Choosen Permissions</label>
                        <div class="d-flex justify-content-center">
                            <select class="form-control bg-light text-dark" id="permissions" name="permissions" multiple style="max-width:400px; height:400px;">
                                {% for group_per in group_permissions %}
                                    <option value="{{group_per.id}}">{{group_per.name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="" style="padding:20px 20px 20px 0px;">
                    <button class="btn cb" type="submit" style="">Save</button>
                    <a data-url="{% url 'groups_delete' group.id %}" class="btn cb" title="Delete Record"  data-toggle="modal" data-target="#deleteConfirmModal"  onclick="showDeleteModal(this)">
                        Delete
                    </a>
                </div>
            </form>

            <!--Group delete confirmation modal -->
                    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Confirm Deletion</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <p>Are you sure you want to delete this Group? This action cannot be undone.</p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                                    <a id="confirmDeleteBtn" class="btn btn-danger" href="#">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
            <!-- end Group modal -->
        </div>

        <script>
            let usernameTimeout;
            const old_perms = document.getElementById('old_permissions');
            const choosen_perms = document.getElementById('permissions');
            
            /* mark all permissions select in target select box*/
            document.addEventListener("DOMContentLoaded", function() {
                document.getElementById("group-form").addEventListener("submit", function (event){
                    Array.from(choosen_perms.options).forEach(option => option.selected = true);
                });
            })

            function checkUnique(element){
                clearTimeout(usernameTimeout);
                let field = null;
                let value = null;
                let error = null;
                
                if (element.name == 'name'){
                    field = 'group_name'
                    value = element.value
                    error = $("#username_error")
                    if (value.length < 6){
                        element.setCustomValidity('name should be greator then 5 characters.');
                        error.hide()
                    }
                    else {
                        element.setCustomValidity('');
                        usernameTimeout = setTimeout(function () {
                            $.ajax({
                                url: "{% url 'check_unique' %}",
                                type: "GET",
                                data: { 'field': field, 'value':value },
                                success: function(response) {
                                    if (response.exists==true) {
                                        error.css('color','red')
                                        error.html(response.message)
                                        error.show();
                                    } else if(response.exists==false) {
                                        error.css('color','green')
                                        error.html(response.message)
                                        error.show()
                                    }
                                }
                            });
                        }, 500);
                    }
                }
                element.reportValidity();
            }

            function moveToChoosen(element){
                const selectedOptions = Array.from(old_perms.selectedOptions);
                selectedOptions.forEach(option => {
                    old_perms.removeChild(option);
                    choosen_perms.appendChild(option);
                })
            }
            function moveToPermission(element){
                const selectedOptions = Array.from(choosen_perms.selectedOptions);
                selectedOptions.forEach(option => {
                    choosen_perms.removeChild(option);
                    old_perms.appendChild(option);
                })
            }

            function showDeleteModal(element) {
                let deleteUrl = element.getAttribute("data-url");
                console.log(deleteUrl)
                document.getElementById("confirmDeleteBtn").href = deleteUrl;
            }
        </script>
    {% endblock %}
